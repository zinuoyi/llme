<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            color: rgba(0, 0, 0, 0.5);
            pointer-events: none;
            z-index: -1;
            white-space: nowrap;
            font-weight: 300;
        }
        .fade-out {
            opacity: 0;
            transition: opacity 0.5s ease-out;
        }
        .message {
            max-width: 80%;
            margin-bottom: 1rem;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            line-height: 1.4;
        }
        .user-message {
            background-color: #f3f4f6;
            margin-left: auto;
            border-top-right-radius: 0;
        }
        .bot-message {
            background-color: #e5e7eb;
            margin-right: auto;
            border-top-left-radius: 0;
        }
        .chat-container {
            height: calc(100vh - 120px);
            overflow-y: auto;
            padding: 1rem;
        }
    </style>
</head>
<body class="bg-white font-sans">
    <div id="watermark" class="bg-watermark">What do you want to know about me?</div>

    <div id="chat-container" class="chat-container"></div>

    <div class="fixed bottom-0 left-0 right-0 bg-white p-4 border-t border-gray-200">
        <div class="flex items-center max-w-3xl mx-auto">
            <input
                id="user-input"
                type="text"
                placeholder="Type your message..."
                class="flex-1 px-4 py-2 border border-gray-300 rounded-l-lg focus:outline-none focus:ring-1 focus:ring-gray-400"
                autocomplete="off"
            >
            <button
                id="send-button"
                class="px-4 py-2 bg-gray-800 text-white rounded-r-lg hover:bg-gray-700 focus:outline-none focus:ring-1 focus:ring-gray-600"
            >
                Send
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const userInput = document.getElementById('user-input');
            const sendButton = document.getElementById('send-button');
            const chatContainer = document.getElementById('chat-container');
            const watermark = document.getElementById('watermark');
            let hasInteraction = false;

            // Handle sending messages
            function sendMessage() {
                const message = userInput.value.trim();
                if (message === '') return;

                if (!hasInteraction) {
                    hasInteraction = true;
                    watermark.classList.add('fade-out');
                }

                // Add user message
                addMessage(message, 'user');
                userInput.value = '';

                // Simulate bot response after a short delay
                setTimeout(() => {
                    const responses = [
                        "I'm designed to be simple and straightforward.",
                        "My purpose is to answer your questions clearly.",
                        "I focus on providing concise responses.",
                        "What else would you like to know?",
                        "I appreciate your curiosity."
                    ];
                    const randomResponse = responses[Math.floor(Math.random() * responses.length)];
                    addMessage(randomResponse, 'bot');
                }, 500);
            }

            // Add a message to the chat
            function addMessage(text, sender) {
                const messageDiv = document.createElement('div');
                messageDiv.classList.add('message');
                messageDiv.classList.add(sender === 'user' ? 'user-message' : 'bot-message');
                messageDiv.textContent = text;
                chatContainer.appendChild(messageDiv);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }

            // Event listeners
            sendButton.addEventListener('click', sendMessage);

            userInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });

            // Focus the input field on page load
            userInput.focus();
        });
    </script>
</body>
</html>
