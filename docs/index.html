<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT-Style Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Typing indicator animation */
        @keyframes typing {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        .typing-indicator span {
            animation: typing 1.5s infinite;
        }
        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        /* Message transition */
        .message-enter {
            opacity: 0;
            transform: translateY(10px);
        }
        .message-enter-active {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 300ms, transform 300ms;
        }

        /* Background pattern */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 20px 20px;
            opacity: 0.1;
            pointer-events: none;
            z-index: -1;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased">
    <div class="flex flex-col h-screen">
        <!-- Header -->
        <header class="bg-white border-b border-gray-200 py-3 px-4 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-full bg-gradient-to-r from-green-400 to-blue-500 flex items-center justify-center text-white font-bold">
                    AI
                </div>
                <h1 class="text-lg font-semibold">Chat Assistant</h1>
            </div>
            <div class="flex items-center space-x-4">
                <button class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-sun"></i>
                </button>
                <button class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-cog"></i>
                </button>
            </div>
        </header>

        <!-- Chat container -->
        <div class="flex-1 overflow-y-auto p-4 space-y-6" id="chat-container">
            <!-- Welcome message -->
            <div class="max-w-3xl mx-auto">
                <div class="flex space-x-3">
                    <div class="flex-shrink-0">
                        <div class="w-8 h-8 rounded-full bg-gradient-to-r from-green-400 to-blue-500 flex items-center justify-center text-white font-bold">
                            AI
                        </div>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200">
                            <p class="text-gray-800">Hello! I'm your AI assistant. How can I help you today?</p>
                            <div class="mt-3 flex flex-wrap gap-2">
                                <button class="suggestion-btn px-3 py-1.5 text-sm bg-gray-100 hover:bg-gray-200 rounded-full transition-colors">
                                    Explain quantum computing
                                </button>
                                <button class="suggestion-btn px-3 py-1.5 text-sm bg-gray-100 hover:bg-gray-200 rounded-full transition-colors">
                                    Give me creative ideas
                                </button>
                                <button class="suggestion-btn px-3 py-1.5 text-sm bg-gray-100 hover:bg-gray-200 rounded-full transition-colors">
                                    How to make a website?
                                </button>
                            </div>
                        </div>
                        <div class="mt-1 text-xs text-gray-500">
                            <span>AI Assistant</span>
                            <span class="mx-1">·</span>
                            <span>Just now</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Sample conversation (will be populated by JS) -->
        </div>

        <!-- Input area -->
        <div class="bg-white border-t border-gray-200 p-4">
            <div class="max-w-3xl mx-auto relative">
                <form id="chat-form" class="relative">
                    <textarea
                        id="message-input"
                        rows="1"
                        placeholder="Message AI Assistant..."
                        class="w-full p-4 pr-12 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 resize-none bg-white shadow-sm transition-all"
                        style="min-height: 60px; max-height: 200px;"
                    ></textarea>
                    <button
                        type="submit"
                        id="send-btn"
                        class="absolute right-3 bottom-3 p-1 rounded-md text-gray-500 hover:text-blue-600 hover:bg-blue-50 transition-colors disabled:opacity-50 disabled:hover:bg-transparent"
                        disabled
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" />
                        </svg>
                    </button>
                </form>
                <div class="mt-2 text-xs text-gray-500 text-center">
                    AI Assistant can make mistakes. Consider checking important information.
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const chatForm = document.getElementById('chat-form');
            const messageInput = document.getElementById('message-input');
            const sendBtn = document.getElementById('send-btn');
            const chatContainer = document.getElementById('chat-container');
            const suggestionBtns = document.querySelectorAll('.suggestion-btn');

            // Auto-resize textarea
            messageInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';

                // Enable/disable send button
                sendBtn.disabled = this.value.trim() === '';
            });

            // Handle form submission
            chatForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const message = messageInput.value.trim();
                if (message) {
                    addUserMessage(message);
                    messageInput.value = '';
                    messageInput.style.height = '60px';
                    sendBtn.disabled = true;

                    // Show typing indicator
                    showTypingIndicator();

                    // Simulate AI response after a delay
                    setTimeout(() => {
                        removeTypingIndicator();
                        addAiMessage(generateResponse(message));
                    }, 1000 + Math.random() * 2000);
                }
            });

            // Handle suggestion buttons
            suggestionBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    messageInput.value = this.textContent;
                    messageInput.style.height = 'auto';
                    messageInput.style.height = (messageInput.scrollHeight) + 'px';
                    sendBtn.disabled = false;
                    messageInput.focus();
                });
            });

            // Add a user message to the chat
            function addUserMessage(text) {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'max-w-3xl mx-auto message-enter';
                messageDiv.innerHTML = `
                    <div class="flex space-x-3 justify-end">
                        <div class="flex-1 min-w-0">
                            <div class="bg-blue-600 text-white p-4 rounded-lg shadow-sm">
                                <p>${text}</p>
                            </div>
                            <div class="mt-1 text-xs text-gray-500 text-right">
                                <span>You</span>
                                <span class="mx-1">·</span>
                                <span>Just now</span>
                            </div>
                        </div>
                        <div class="flex-shrink-0">
                            <div class="w-8 h-8 rounded-full bg-gray-300 flex items-center justify-center text-gray-600 font-bold">
                                <i class="fas fa-user"></i>
                            </div>
                        </div>
                    </div>
                `;

                // Add transition effect
                setTimeout(() => {
                    messageDiv.classList.add('message-enter-active');
                }, 10);

                chatContainer.appendChild(messageDiv);
                scrollToBottom();
            }

            // Add an AI message to the chat
            function addAiMessage(text) {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'max-w-3xl mx-auto message-enter';
                messageDiv.innerHTML = `
                    <div class="flex space-x-3">
                        <div class="flex-shrink-0">
                            <div class="w-8 h-8 rounded-full bg-gradient-to-r from-green-400 to-blue-500 flex items-center justify-center text-white font-bold">
                                AI
                            </div>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200">
                                <p class="text-gray-800">${text}</p>
                            </div>
                            <div class="mt-1 text-xs text-gray-500">
                                <span>AI Assistant</span>
                                <span class="mx-1">·</span>
                                <span>Just now</span>
                            </div>
                        </div>
                    </div>
                `;

                // Add transition effect
                setTimeout(() => {
                    messageDiv.classList.add('message-enter-active');
                }, 10);

                chatContainer.appendChild(messageDiv);
                scrollToBottom();
            }

            // Show typing indicator
            function showTypingIndicator() {
                const typingDiv = document.createElement('div');
                typingDiv.className = 'max-w-3xl mx-auto';
                typingDiv.innerHTML = `
                    <div class="flex space-x-3">
                        <div class="flex-shrink-0">
                            <div class="w-8 h-8 rounded-full bg-gradient-to-r from-green-400 to-blue-500 flex items-center justify-center text-white font-bold">
                                AI
                            </div>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="bg-white p-3 rounded-lg shadow-sm border border-gray-200">
                                <div class="typing-indicator flex space-x-1">
                                    <span class="w-2 h-2 rounded-full bg-gray-400"></span>
                                    <span class="w-2 h-2 rounded-full bg-gray-400"></span>
                                    <span class="w-2 h-2 rounded-full bg-gray-400"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                typingDiv.id = 'typing-indicator';
                chatContainer.appendChild(typingDiv);
                scrollToBottom();
            }

            // Remove typing indicator
            function removeTypingIndicator() {
                const typingIndicator = document.getElementById('typing-indicator');
                if (typingIndicator) {
                    typingIndicator.remove();
                }
            }

            // Scroll to bottom of chat
            function scrollToBottom() {
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }

            // Generate a response based on user input
            function generateResponse(userMessage) {
                const responses = {
                    "hello": "Hello there! How can I assist you today?",
                    "hi": "Hi! What would you like to talk about?",
                    "how are you": "I'm just a computer program, so I don't have feelings, but I'm functioning perfectly! How can I help you?",
                    "what's your name": "I'm an AI assistant created to help answer your questions. You can call me Assistant!",
                    "bye": "Goodbye! Feel free to come back if you have more questions.",
                    "thanks": "You're welcome! Is there anything else I can help with?",
                    "thank you": "My pleasure! Let me know if you need anything else."
                };

                const lowerMessage = userMessage.toLowerCase();

                // Check for exact matches first
                if (responses[lowerMessage]) {
                    return responses[lowerMessage];
                }

                // Check for partial matches
                for (const [key, value] of Object.entries(responses)) {
                    if (lowerMessage.includes(key)) {
                        return value;
                    }
                }

                // Default responses for common question types
                if (lowerMessage.startsWith("what") || lowerMessage.startsWith("how") || lowerMessage.startsWith("why")) {
                    return "That's an interesting question. While I don't have personal opinions, I can provide information on that topic. Could you be more specific about what you'd like to know?";
                }

                if (lowerMessage.startsWith("can you")) {
                    return "I can certainly try to help with that! Please provide more details about what you need.";
                }

                // Fallback response
                const fallbackResponses = [
                    "I understand you're asking about: " + userMessage + ". Could you elaborate a bit more on what you'd like to know?",
                    "That's an interesting topic. What specific aspect of " + userMessage + " would you like me to focus on?",
                    "I can provide information about " + userMessage + ". What would you like to know specifically?",
                    "Thanks for sharing that. How can I assist you with " + userMessage + "?",
                    "I'd be happy to help with " + userMessage + ". Could you provide some more details about what you're looking for?"
                ];

                return fallbackResponses[Math.floor(Math.random() * fallbackResponses.length)];
            }

            // Allow Shift+Enter for new lines, Enter to submit
            messageInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    chatForm.dispatchEvent(new Event('submit'));
                }
            });
        });
    </script>
</body>
</html>
